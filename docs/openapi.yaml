    CsrfTokenResponse:
      type: object
      description: "Token CSRF. O mesmo valor fica no cookie XSRF-TOKEN (legível por\
        \ JavaScript), reemitido a cada resposta."
      properties:
        headerName:
          type: string
          description: Header onde o token deve ser enviado em POST/PUT/PATCH/DELETE.
          example: X-XSRF-TOKEN
        token:
          type: string
          description: Valor do token.
          example: 3f0e5a2c-1b4d-4e6f-8a9b-0c1d2e3f4a5b
      required:
      - headerName
      - token
  securitySchemes:
    sessionCookie:
      type: apiKey
      description: "Cookie de sessão (HttpOnly), criado no login."
      name: SESSION
      in: cookie
    csrfHeader:
      type: apiKey
      description: "Token CSRF: valor do cookie XSRF-TOKEN. Obrigatório em POST/PUT/PATCH/DELETE."
      name: X-XSRF-TOKEN
      in: header
