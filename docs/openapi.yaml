            \ ou INVALID_PARAMETER."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: sem sessão ou sessão expirada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: INTERNAL_ERROR.
          content:
            application/json:
