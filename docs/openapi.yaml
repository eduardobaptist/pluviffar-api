          type: array
          description: Itens da página.
          items:
            $ref: "#/components/schemas/StationResponse"
        page:
          type: integer
          format: int32
          description: Número da página (começa em 0).
          example: 0
        size:
          type: integer
          format: int32
          description: Tamanho da página.
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Total de itens.
          example: 42
        totalPages:
          type: integer
          format: int32
          description: Total de páginas.
          example: 3
      required:
      - content
      - page
