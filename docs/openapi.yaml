            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - sessionCookie: []
    post:
      tags:
      - Estações
      summary: Cadastrar estação
      description: "Registra o chip ID do pluviômetro, vinculado a um gateway do mesmo\
        \ produtor. Só pacotes MQTT de equipamentos cadastrados são gravados."
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStationRequest"
        required: true
      responses:
        "201":
          description: Estação cadastrada (header Location aponta para ela).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationResponse"
        "400":
          description: VALIDATION_ERROR (inclui locationComplete e publicWithLocation).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "GATEWAY_NOT_FOUND (gateway inexistente, excluído ou de outro\
            \ produtor)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: HARDWARE_ID_ALREADY_REGISTERED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: sem sessão ou sessão expirada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "ACCESS_DENIED, CSRF_TOKEN_INVALID ou PASSWORD_CHANGE_REQUIRED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: INTERNAL_ERROR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - sessionCookie: []
        csrfHeader: []
  /api/gateways:
    get:
      tags:
      - Gateways
      summary: Listar gateways
      description: "PRODUCER: só os próprios. ADMIN: todos, com filtro opcional por\
        \ dono. sort aceita: name, hardwareId, createdAt, updatedAt. Padrão: name,asc."
      operationId: list_2
      parameters:
      - name: ownerId
        in: query
        description: "Somente ADMIN: filtra por produtor dono."
        required: false
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        description: Busca por parte do nome ou do chip ID.
        required: false
        schema:
          type: string
        example: sede
      - name: includeDeleted
        in: query
        description: "Somente ADMIN: inclui gateways excluídos."
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "name,ASC"
          items:
            type: string
      responses:
        "200":
          description: Página de gateways.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseGatewayResponse"
        "400":
          description: "VALIDATION_ERROR (com errors por campo), MALFORMED_REQUEST\
            \ ou INVALID_PARAMETER."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: sem sessão ou sessão expirada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: ACCESS_DENIED ou PASSWORD_CHANGE_REQUIRED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: INTERNAL_ERROR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - sessionCookie: []
    post:
      tags:
      - Gateways
      summary: Cadastrar gateway
      description: "Registra o chip ID do gateway. Só pacotes MQTT de equipamentos\
        \ cadastrados são gravados. PRODUCER: o dono é ele mesmo (omita ownerId).\
        \ ADMIN: informe ownerId (produtor ativo)."
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGatewayRequest"
        required: true
      responses:
        "201":
          description: Gateway cadastrado (header Location aponta para ele).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayResponse"
        "400":
          description: "VALIDATION_ERROR, OWNER_REQUIRED (ADMIN sem ownerId) ou INVALID_OWNER."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "ACCESS_DENIED (PRODUCER informando outro dono), CSRF_TOKEN_INVALID\
            \ ou PASSWORD_CHANGE_REQUIRED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: HARDWARE_ID_ALREADY_REGISTERED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: sem sessão ou sessão expirada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: INTERNAL_ERROR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - sessionCookie: []
        csrfHeader: []
  /api/auth/logout:
    post:
      tags:
      - Autenticação
      summary: Logout
      description: "Invalida a sessão e limpa os cookies SESSION e XSRF-TOKEN. Requer\
        \ o header X-XSRF-TOKEN. Idempotente: sem sessão, também responde 204."
      operationId: logout
      responses:
        "204":
          description: Sessão encerrada.
        "403":
          description: "CSRF_TOKEN_INVALID: header X-XSRF-TOKEN ausente ou diferente\
            \ do cookie."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: INTERNAL_ERROR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - csrfHeader: []
  /api/auth/login:
    post:
      tags:
      - Autenticação
      summary: Login
      description: "Autentica por email e senha e cria a sessão (cookie SESSION, HttpOnly).\
        \ Requer o header X-XSRF-TOKEN. O ID da sessão e o token CSRF são renovados:\
        \ use o novo cookie XSRF-TOKEN a partir daqui. Se mustChangePassword = true,\
        \ leve o usuário à troca de senha."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Login efetuado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: "INVALID_CREDENTIALS: email ou senha inválidos (mensagem ú\
            nica, não revela se o usuário existe)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: "VALIDATION_ERROR (com errors por campo), MALFORMED_REQUEST\
            \ ou INVALID_PARAMETER."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "CSRF_TOKEN_INVALID: header X-XSRF-TOKEN ausente ou diferente\
            \ do cookie."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: INTERNAL_ERROR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - csrfHeader: []
  /api/users/{id}/status:
    patch:
      tags:
      - Usuários
      summary: Ativar/desativar usuário
      description: Desativar impede o login e encerra imediatamente todas as sessões
        do usuário. O ADMIN não pode desativar a si mesmo.
      operationId: updateStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
        required: true
      responses:
        "200":
          description: Status atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: USER_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CANNOT_DEACTIVATE_SELF.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: "ACCESS_DENIED (não é ADMIN), CSRF_TOKEN_INVALID ou PASSWORD_CHANGE_REQUIRED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: "VALIDATION_ERROR (com errors por campo), MALFORMED_REQUEST\
            \ ou INVALID_PARAMETER."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "UNAUTHENTICATED: sem sessão ou sessão expirada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: INTERNAL_ERROR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - sessionCookie: []
        csrfHeader: []
  /api/auth/me:
    get:
      tags:
      - Autenticação
      summary: Usuário logado
      description: "Dados e perfil do usuário da sessão. O front não lê o cookie HttpOnly,\
        \ então usa este endpoint para saber se há sessão: 401 = sem sessão/expirada."
      operationId: me
      responses:
        "200":
          description: Usuário logado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: "UNAUTHENTICATED: sem sessão ou sessão expirada."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: ACCESS_DENIED ou PASSWORD_CHANGE_REQUIRED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: INTERNAL_ERROR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - sessionCookie: []
  /api/auth/csrf:
    get:
      tags:
      - Autenticação
      summary: Obter token CSRF
      description: "Emite o cookie XSRF-TOKEN e devolve o mesmo valor no corpo. Chame\
        \ ao abrir a aplicação, antes do login. O cookie é reemitido em toda resposta,\
        \ inclusive quando o token é renovado após o login."
      operationId: csrf
      responses:
        "200":
          description: Token emitido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
        "500":
          description: INTERNAL_ERROR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
components:
  schemas:
    UpdateUserRequest:
      type: object
      description: "Edição de usuário pelo ADMIN (substitui nome, email e perfil).\
        \ Trocar o perfil encerra as sessões ativas do usuário."
      properties:
        name:
          type: string
          description: Nome.
          example: Maria da Silva
          maxLength: 120
          minLength: 0
        email:
          type: string
          format: email
          description: "Email (único, sem diferenciar maiúsculas)."
          example: maria@exemplo.com.br
          maxLength: 254
          minLength: 0
        role:
          type: string
          description: Perfil.
          enum:
          - ADMIN
          - PRODUCER
          example: PRODUCER
      required:
      - email
      - name
      - role
    ApiError:
      description: Corpo padrão de toda resposta de erro (4xx/5xx).
      properties:
        code:
          type: string
          description: Código estável do erro (enum ErrorCode); use-o no frontend
            para decidir o comportamento.
          example: VALIDATION_ERROR
        message:
          type: string
          description: Mensagem pronta para exibir ao usuário (pt-BR).
          example: Há campos inválidos na requisição.
        errors:
          type: array
          description: Erros por campo (apenas em VALIDATION_ERROR; vazio nos demais).
          items:
            $ref: "#/components/schemas/FieldError"
        traceId:
          type: string
          description: Identificador da requisição (também no header X-Trace-Id);
            informe-o ao reportar problemas.
          example: 6f1c2a9e4b7d4e0f9a3b1c2d3e4f5a6b
      required:
      - code
      - errors
      - message
      - traceId
    FieldError:
      description: Erro de validação de um campo.
      properties:
        field:
          type: string
          description: Nome do campo (ou parâmetro) inválido.
          example: email
        message:
          type: string
          description: Mensagem para o usuário (pt-BR).
          example: Informe um email válido.
      required:
      - field
      - message
    UserResponse:
      type: object
      description: Dados de um usuário (nunca inclui a senha).
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do usuário.
          example: 019a6f3e-8b1c-7d2e-9f40-1a2b3c4d5e6f
        name:
          type: string
          description: Nome.
          example: Maria da Silva
        email:
          type: string
          description: Email (sempre em minúsculas).
          example: maria@exemplo.com.br
        role:
          type: string
          description: Perfil.
          enum:
          - ADMIN
          - PRODUCER
          example: PRODUCER
        active:
          type: boolean
          description: Se o usuário pode fazer login.
          example: true
        mustChangePassword:
          type: boolean
          description: Se precisa trocar a senha antes de usar a plataforma.
          example: false
        createdAt:
          type: string
          format: date-time
          description: "Criação (ISO-8601, UTC)."
          example: 2026-11-10T12:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: "Última alteração (ISO-8601, UTC)."
          example: 2026-11-10T12:00:00Z
      required:
      - active
      - createdAt
      - email
      - id
      - mustChangePassword
      - name
      - role
      - updatedAt
    ResetPasswordRequest:
      type: object
      description: Redefinição de senha pelo ADMIN. A nova senha é provisória (troca
        obrigatória no próximo login) e todas as sessões do usuário são encerradas.
      properties:
        newPassword:
          type: string
          description: Nova senha provisória (8 a 72 caracteres).
          example: novaProvisoria123
          maxLength: 72
          minLength: 8
      required:
      - newPassword
    UpdateStationRequest:
      type: object
      description: "Edição de estação (substitui todos os campos editáveis). O chip\
        \ ID não muda: para trocar o equipamento, exclua e cadastre outro."
      properties:
        gatewayId:
          type: string
          format: uuid
          description: "Gateway que recebe os dados desta estação (precisa ser do\
            \ mesmo produtor). ADMIN pode escolher gateway de outro produtor: a estaç\
            ão passa a ser desse produtor."
          example: 019a6f3e-8b1c-7d2e-9f40-1a2b3c4d5e6f
        name:
          type: string
          description: Nome.
          example: Pluviômetro do talhão 3
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Descrição livre.
          example: Ao lado da porteira
          maxLength: 1000
          minLength: 0
        latitude:
          type: number
          format: double
          description: Latitude em graus decimais (WGS84). Informe junto com a longitude.
          example: -29.6842
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          description: Longitude em graus decimais (WGS84). Informe junto com a latitude.
          example: -53.8069
          maximum: 180
          minimum: -180
        isPublic:
          type: boolean
          description: "Mostrar na área pública (só chuva e localização). Exige latitude/longitude.\
            \ Padrão: false."
          example: false
      required:
      - gatewayId
      - name
    GatewaySummary:
      type: object
      description: Gateway ao qual a estação está vinculada.
      properties:
        id:
          type: string
          format: uuid
          description: ID do gateway.
          example: 019a6f3e-8b1c-7d2e-9f40-1a2b3c4d5e6f
        hardwareId:
          type: string
          description: Chip ID do gateway.
          example: gt-570db4
        name:
          type: string
          description: Nome do gateway.
          example: Gateway da sede
      required:
      - hardwareId
      - id
      - name
    OwnerSummary:
      type: object
      description: Produtor dono do equipamento (nunca exposto na área pública).
      properties:
        id:
          type: string
          format: uuid
          description: ID do produtor.
          example: 019a6f3e-8b1c-7d2e-9f40-1a2b3c4d5e6f
        name:
          type: string
          description: Nome do produtor.
          example: Maria da Silva
        email:
          type: string
          description: Email do produtor.
          example: maria@exemplo.com.br
      required:
      - email
      - id
      - name
    StationResponse:
      type: object
      description: "Estação (pluviômetro), na visão do dono/ADMIN. A área pública\
        \ usa outro DTO, sem dados do dono."
      properties:
        id:
          type: string
          format: uuid
          description: ID da estação na plataforma.
          example: 019a6f3e-8b1c-7d2e-9f40-1a2b3c4d5e6f
        hardwareId:
          type: string
          description: Chip ID do pluviômetro (campo id do payload MQTT). Imutável.
          example: 580db2
        name:
          type: string
          description: Nome.
          example: Pluviômetro do talhão 3
        description:
          type: string
          description: Descrição livre.
          example: Ao lado da porteira
        latitude:
          type: number
          format: double
          description: "Latitude (graus decimais, WGS84)."
          example: -29.6842
        longitude:
          type: number
          format: double
          description: "Longitude (graus decimais, WGS84)."
          example: -53.8069
        isPublic:
          type: boolean
          description: "Se aparece na área pública (só chuva e localização, nunca\
            \ dados do dono)."
          example: true
        gateway:
          $ref: "#/components/schemas/GatewaySummary"
          description: Gateway vinculado.
        owner:
          $ref: "#/components/schemas/OwnerSummary"
          description: Produtor dono (sempre o dono do gateway).
        fwVersion:
          type: string
          description: Firmware reportado pelo pluviômetro (tópico conf).
          example: 1.0.0
        hwVersion:
          type: string
          description: Hardware reportado pelo pluviômetro (tópico conf).
          example: "1.0"
        sendIntervalS:
          type: integer
          format: int32
          description: "Intervalo de envio reportado, em segundos."
          example: 60
        mmPerTip:
          type: number
          description: Milímetros por basculada reportados.
          example: 0.2
        configReportedAt:
          type: string
          format: date-time
          description: Quando o dispositivo reportou a configuração pela última vez.
          example: 2026-11-10T12:00:00Z
        createdAt:
          type: string
          format: date-time
          description: Criação.
          example: 2026-11-10T12:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: Última alteração.
          example: 2026-11-10T12:00:00Z
        deletedAt:
          type: string
          format: date-time
          description: Exclusão (soft delete); preenchido só para o ADMIN com includeDeleted=true.
      required:
      - createdAt
      - gateway
      - hardwareId
      - id
      - isPublic
      - name
      - owner
      - updatedAt
    UpdateGatewayRequest:
      type: object
      description: "Edição de gateway (substitui nome e descrição). O chip ID não\
        \ muda: para trocar o equipamento, exclua e cadastre outro."
      properties:
        name:
          type: string
          description: Nome.
          example: Gateway da sede
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Descrição livre.
          example: Instalado no galpão principal
          maxLength: 1000
          minLength: 0
        ownerId:
          type: string
          format: uuid
          description: "Somente ADMIN: transfere o gateway (e todas as estações dele)\
            \ para outro produtor. Omitir mantém o dono atual."
          example: 019a6f3e-8b1c-7d2e-9f40-1a2b3c4d5e6f
      required:
      - name
    GatewayResponse:
      type: object
      description: Gateway (ESP8266 que recebe dos pluviômetros e publica no broker
        MQTT).
      properties:
        id:
          type: string
          format: uuid
          description: ID do gateway na plataforma.
          example: 019a6f3e-8b1c-7d2e-9f40-1a2b3c4d5e6f
        hardwareId:
          type: string
          description: "Chip ID (segmento do tópico MQTT pluviffar/{hardwareId}/...).\
            \ Imutável."
          example: gt-570db4
        name:
          type: string
          description: Nome.
          example: Gateway da sede
        description:
          type: string
          description: Descrição livre.
          example: Instalado no galpão principal
        owner:
          $ref: "#/components/schemas/OwnerSummary"
          description: Produtor dono.
        fwVersion:
          type: string
          description: Versão de firmware reportada pelo dispositivo (tópico conf).
          example: 1.0.0
        hwVersion:
          type: string
          description: Versão de hardware reportada pelo dispositivo (tópico conf).
          example: "1.0"
        configReportedAt:
          type: string
          format: date-time
          description: Quando o dispositivo reportou a configuração pela última vez.
          example: 2026-11-10T12:00:00Z
        createdAt:
          type: string
          format: date-time
          description: Criação.
          example: 2026-11-10T12:00:00Z
        updatedAt:
          type: string
          format: date-time
          description: Última alteração.
          example: 2026-11-10T12:00:00Z
        deletedAt:
          type: string
          format: date-time
          description: Exclusão (soft delete); preenchido só em listagens do ADMIN
            com includeDeleted=true.
      required:
      - createdAt
      - hardwareId
      - id
      - name
      - owner
      - updatedAt
    ChangePasswordRequest:
      type: object
      description: Troca da própria senha. Encerra as outras sessões do usuário e
        libera o acesso quando a troca era obrigatória.
      properties:
        currentPassword:
          type: string
          description: Senha atual.
          example: senhaProvisoria123
          minLength: 1
        newPassword:
          type: string
          description: "Nova senha (8 a 72 caracteres, diferente da atual)."
          example: minhaNovaSenha456
          maxLength: 72
          minLength: 8
      required:
      - currentPassword
      - newPassword
    CreateUserRequest:
      type: object
      description: "Cadastro de usuário pelo ADMIN. A senha é provisória: o usuário\
        \ deve trocá-la no primeiro login."
      properties:
        name:
          type: string
          description: Nome.
          example: Maria da Silva
          maxLength: 120
          minLength: 0
        email:
          type: string
          format: email
          description: "Email (único, sem diferenciar maiúsculas)."
          example: maria@exemplo.com.br
          maxLength: 254
          minLength: 0
        role:
          type: string
          description: Perfil.
          enum:
          - ADMIN
          - PRODUCER
          example: PRODUCER
        password:
          type: string
          description: Senha provisória (8 a 72 caracteres).
          example: senhaProvisoria123
          maxLength: 72
          minLength: 8
      required:
      - email
      - name
      - password
      - role
    CreateStationRequest:
      type: object
      description: Cadastro de estação (pluviômetro). Só pacotes de equipamentos cadastrados
        são gravados pelo worker. O dono é sempre o dono do gateway.
      properties:
        hardwareId:
          type: string
          description: "Chip ID do pluviômetro, como vem no campo id do payload (normalizado\
            \ para minúsculas). Não pode ser alterado depois."
          example: 580db2
          maxLength: 32
          minLength: 1
          pattern: "^[a-z0-9-]{1,32}$"
        gatewayId:
          type: string
          format: uuid
          description: "Gateway que recebe os dados desta estação (precisa ser do\
            \ mesmo produtor). ADMIN pode escolher gateway de outro produtor: a estaç\
            ão passa a ser desse produtor."
          example: 019a6f3e-8b1c-7d2e-9f40-1a2b3c4d5e6f
        name:
          type: string
          description: Nome.
          example: Pluviômetro do talhão 3
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Descrição livre.
          example: Ao lado da porteira
          maxLength: 1000
          minLength: 0
        latitude:
          type: number
          format: double
          description: Latitude em graus decimais (WGS84). Informe junto com a longitude.
          example: -29.6842
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          description: Longitude em graus decimais (WGS84). Informe junto com a latitude.
          example: -53.8069
          maximum: 180
          minimum: -180
        isPublic:
          type: boolean
          description: "Mostrar na área pública (só chuva e localização). Exige latitude/longitude.\
            \ Padrão: false."
          example: false
      required:
      - gatewayId
      - hardwareId
      - name
    CreateGatewayRequest:
      type: object
      description: Cadastro de gateway. Só pacotes de equipamentos cadastrados são
        gravados pelo worker.
      properties:
        hardwareId:
          type: string
          description: "Chip ID do gateway, como aparece no tópico MQTT (normalizado\
            \ para minúsculas). Não pode ser alterado depois."
          example: gt-570db4
          maxLength: 32
          minLength: 1
          pattern: "^[a-z0-9-]{1,32}$"
        name:
          type: string
          description: Nome.
          example: Gateway da sede
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: Descrição livre.
          example: Instalado no galpão principal
          maxLength: 1000
          minLength: 0
        ownerId:
          type: string
          format: uuid
          description: Produtor dono. Obrigatório para ADMIN; PRODUCER deve omitir
            (o dono é ele mesmo).
          example: 019a6f3e-8b1c-7d2e-9f40-1a2b3c4d5e6f
      required:
      - hardwareId
      - name
    LoginRequest:
      type: object
      description: Credenciais de login.
      properties:
        email:
          type: string
          description: Email do usuário.
          example: maria@exemplo.com.br
          minLength: 1
        password:
          type: string
          description: Senha.
          example: minhaSenha123
          minLength: 1
      required:
      - email
      - password
    CurrentUserResponse:
      type: object
      description: Usuário logado.
      properties:
        id:
          type: string
          format: uuid
          description: Identificador do usuário.
          example: 019a6f3e-8b1c-7d2e-9f40-1a2b3c4d5e6f
        name:
          type: string
          description: Nome.
          example: Maria da Silva
        email:
          type: string
          description: Email.
          example: maria@exemplo.com.br
        role:
          type: string
          description: Perfil (define as áreas que o front libera).
          enum:
          - ADMIN
          - PRODUCER
          example: PRODUCER
        mustChangePassword:
          type: boolean
          description: "Se true, o front deve levar o usuário à troca de senha: o\
            \ resto da API responde 403 PASSWORD_CHANGE_REQUIRED até a troca."
          example: false
      required:
      - email
      - id
      - mustChangePassword
      - name
      - role
    UpdateUserStatusRequest:
      type: object
      description: Ativa ou desativa um usuário. Desativar encerra imediatamente todas
        as sessões dele.
      properties:
        active:
          type: boolean
          description: true = ativo; false = desativado (não consegue fazer login).
          example: false
      required:
      - active
    PageResponseUserResponse:
      type: object
      description: "Página de resultados. Parâmetros: page (0-based), size (padrã\
        o 20, máx. 100), sort=campo,asc|desc."
      properties:
        content:
          type: array
          description: Itens da página.
          items:
            $ref: "#/components/schemas/UserResponse"
        page:
          type: integer
          format: int32
          description: Número da página (começa em 0).
          example: 0
        size:
          type: integer
          format: int32
          description: Tamanho da página.
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Total de itens.
          example: 42
        totalPages:
          type: integer
          format: int32
          description: Total de páginas.
          example: 3
      required:
      - content
      - page
      - size
      - totalElements
      - totalPages
    PageResponseStationResponse:
      type: object
      description: "Página de resultados. Parâmetros: page (0-based), size (padrã\
        o 20, máx. 100), sort=campo,asc|desc."
      properties:
