spring.application.name=api
spring.config.import=optional:file:.env[.properties]
# o .env é importado como properties: SPRING_PROFILES_ACTIVE dele não vira spring.profiles.active sozinho
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pluviffar}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pluviffar}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# schema controlado só pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: cria os schemas app e telemetry; histórico em app.flyway_schema_history
spring.flyway.schemas=app,telemetry
spring.flyway.default-schema=app
# seed do ADMIN (V2__SeedAdmin) — valores vêm do ambiente/.env
spring.flyway.placeholders.admin_email=${PLUVIFFAR_ADMIN_EMAIL:}
spring.flyway.placeholders.admin_password=${PLUVIFFAR_ADMIN_PASSWORD:}

# Spring Session JDBC: tabelas criadas pela V1, no schema app; expira após 30 min sem requisições
spring.session.jdbc.table-name=app.SPRING_SESSION
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m

# cookies SESSION e XSRF-TOKEN: Secure por padrão (dev desliga em application-dev.properties)
pluviffar.security.secure-cookies=true
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${pluviffar.security.secure-cookies}

# CORS: origens do frontend (separadas por vírgula); vazio = mesmo site, sem CORS
pluviffar.cors.allowed-origins=${PLUVIFFAR_CORS_ALLOWED_ORIGINS:}

# mensagens e validação sempre em pt-BR
spring.mvc.locale=pt_BR
spring.mvc.locale-resolver=fixed

# paginação padrão
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# OpenAPI (desligado em produção: application-prod.properties)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json

# traceId nos logs
logging.pattern.correlation=[%X{traceId:-}] 
