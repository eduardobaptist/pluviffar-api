# Mensagens ao usuário (pt-BR). Chaves em inglês; ver ErrorCode.

# --- erros (ErrorCode) ---
error.validation=Há campos inválidos na requisição.
error.malformed-request=O corpo da requisição está malformado ou tem valores de tipo inválido.
error.invalid-parameter=Parâmetro inválido ou ausente na requisição.
error.current-password-incorrect=A senha atual está incorreta.
error.new-password-same-as-current=A nova senha deve ser diferente da atual.
error.owner-required=Informe o produtor dono do equipamento.
error.invalid-owner=O dono informado não existe ou não é um produtor ativo.
error.unauthenticated=Sua sessão expirou ou você não está conectado. Faça login novamente.
error.invalid-credentials=Email ou senha inválidos.
error.access-denied=Você não tem permissão para realizar esta ação.
error.csrf-token-invalid=Token de segurança ausente ou inválido. Recarregue a página e tente novamente.
error.password-change-required=É necessário trocar sua senha antes de continuar.
error.resource-not-found=Recurso não encontrado.
error.user-not-found=Usuário não encontrado.
error.gateway-not-found=Gateway não encontrado.
error.station-not-found=Estação não encontrada.
error.method-not-allowed=Método HTTP não suportado para este recurso.
error.unsupported-media-type=Formato de conteúdo não suportado. Envie JSON.
error.email-already-in-use=Já existe um usuário com este email.
error.cannot-change-own-role=Você não pode alterar o seu próprio perfil.
error.cannot-deactivate-self=Você não pode desativar a sua própria conta.
error.hardware-id-already-registered=Este equipamento (chip ID) já está cadastrado na plataforma.
error.gateway-has-active-stations=Este gateway ainda tem estações ativas. Exclua ou mova as estações antes.
error.data-conflict=A operação conflita com dados existentes.
error.internal=Ocorreu um erro inesperado. Tente novamente mais tarde.

# --- validação de campos (Bean Validation) ---
user.name.required=Informe o nome.
user.name.size=O nome deve ter no máximo {max} caracteres.
user.email.required=Informe o email.
user.email.invalid=Informe um email válido.
user.email.size=O email deve ter no máximo {max} caracteres.
user.role.required=Informe o perfil.
user.password.required=Informe a senha.
user.password.size=A senha deve ter entre {min} e {max} caracteres.
user.active.required=Informe se o usuário está ativo.
auth.email.required=Informe o email.
auth.password.required=Informe a senha.
auth.current-password.required=Informe a senha atual.
device.hardware-id.required=Informe o chip ID do equipamento.
device.hardware-id.pattern=O chip ID deve ter de 1 a 32 caracteres: letras minúsculas, números ou hífen (ex.: 580db2).
device.name.required=Informe o nome.
device.name.size=O nome deve ter no máximo {max} caracteres.
device.description.size=A descrição deve ter no máximo {max} caracteres.
station.gateway.required=Informe o gateway da estação.
station.latitude.range=A latitude deve estar entre -90 e 90.
station.longitude.range=A longitude deve estar entre -180 e 180.
station.location.incomplete=Informe latitude e longitude juntas (ou nenhuma das duas).
station.public.requires-location=Uma estação pública precisa ter latitude e longitude.
station.is-public.required=Informe se a estação é pública.
